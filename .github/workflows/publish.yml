name: publish

# 發布到 PyPI（opencc-py-tw2），用 PyPI Trusted Publishing，不需要 API token。
#
# 觸發方式：
# - push 到 main：pyproject.toml 的版本還沒有 v<版本> tag 時，測試 → 發布 → 建立 tag 與 GitHub Release。
#   用 GITHUB_TOKEN 建立的 Release 不會再觸發 release 事件，所以不會重複發布。
# - 在 GitHub 手動建立 Release，或手動 workflow_dispatch：直接測試並發布。
#
# PyPI 的 Trusted Publisher 綁定這個檔名（publish.yml）與 environment「pypi」，改名要同步修改 PyPI 設定。
on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version 已經發布過，略過"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "偵測到新版本 v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # 建立 tag 與 GitHub Release
      id-token: write # PyPI Trusted Publishing（OIDC）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # Release 內容取 CHANGELOG.md 中「## <版本>」的段落；找不到時改列出上一個 tag 之後的 commit
      - name: Create tag and GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > notes.md
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [[ ! -s notes.md ]]; then
            echo "## 變更" > notes.md
            echo >> notes.md
            git log --no-merges --format='- %s (%h)' ${prev:+$prev..}HEAD >> notes.md
          fi
          # 反引號是 Markdown code fence，不是指令替換
          # shellcheck disable=SC2016
          printf '\n## 安裝\n\n```bash\npip install -U opencc-py-tw2==%s\n```\n' "$VERSION" >> notes.md
          if [[ -n "$prev" ]]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$prev" "$VERSION" >> notes.md
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
